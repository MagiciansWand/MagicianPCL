<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicianPCL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* 背景动画 */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(108, 92, 231, 0.6);
      border-radius: 50%;
      animation: float-particle 8s ease-in-out infinite;
    }

    @keyframes float-particle {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    /* Logo 容器 */
    .logo-container {
      position: relative;
      margin-bottom: 40px;
    }

    .logo-3d {
      width: 120px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      animation: logo-rotate 4s ease-in-out infinite;
    }

    @keyframes logo-rotate {
      0%, 100% { transform: rotateY(0deg) rotateX(10deg); }
      25% { transform: rotateY(90deg) rotateX(10deg); }
      50% { transform: rotateY(180deg) rotateX(10deg); }
      75% { transform: rotateY(270deg) rotateX(10deg); }
    }

    .logo-face {
      position: absolute;
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.3), rgba(162, 155, 254, 0.1));
      border: 2px solid rgba(108, 92, 231, 0.5);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-face.front { transform: translateZ(50px); }
    .logo-face.back { transform: rotateY(180deg) translateZ(50px); }
    .logo-face.left { transform: rotateY(-90deg) translateZ(50px); }
    .logo-face.right { transform: rotateY(90deg) translateZ(50px); }
    .logo-face.top { transform: rotateX(90deg) translateZ(50px); }
    .logo-face.bottom { transform: rotateX(-90deg) translateZ(50px); }

    .logo-face svg {
      width: 50px;
      height: 50px;
      stroke: #a29bfe;
      fill: none;
      stroke-width: 2;
    }

    /* 发光效果 */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
    }

    /* 标题 */
    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: title-glow 3s ease-in-out infinite;
    }

    @keyframes title-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 50px;
      animation: fade-in 1s ease 0.5s both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 进度条容器 */
    .progress-container {
      width: 400px;
      max-width: 90vw;
    }

    .status-text {
      font-size: 14px;
      color: #a29bfe;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fade-in 0.5s ease;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }

    .status-icon.done {
      animation: none;
      color: #55efc4;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe, #6c5ce7);
      background-size: 200% 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* 进度百分比 */
    .progress-percent {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }

    /* 检测项列表 */
    .check-list {
      margin-top: 30px;
      width: 400px;
      max-width: 90vw;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      color: #666;
      transition: all 0.3s ease;
    }

    .check-item.active {
      color: #a29bfe;
    }

    .check-item.done {
      color: #55efc4;
    }

    .check-item.error {
      color: #ff7675;
    }

    .check-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 10px;
    }

    .check-item.pending .check-icon {
      border: 2px solid #444;
    }

    .check-item.active .check-icon {
      border: 2px solid #a29bfe;
      background: rgba(108, 92, 231, 0.2);
      animation: pulse-border 1s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: #a29bfe; }
      50% { border-color: #6c5ce7; }
    }

    .check-item.done .check-icon {
      background: #55efc4;
      color: #1a1a2e;
    }

    .check-item.error .check-icon {
      background: #ff7675;
      color: #fff;
    }

    /* 版本信息 */
    .version-info {
      position: fixed;
      bottom: 30px;
      font-size: 11px;
      color: #555;
    }

    .version-info span {
      color: #6c5ce7;
    }

    /* 开发者信息 */
    .developer {
      position: fixed;
      bottom: 15px;
      font-size: 11px;
      color: #444;
    }

    .developer span {
      color: #a29bfe;
    }
  </style>
</head>
<body>
  <!-- 背景粒子 -->
  <div class="bg-particles" id="particles"></div>

  <!-- Logo -->
  <div class="logo-container">
    <div class="glow"></div>
    <div class="logo-3d">
      <div class="logo-face front">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-face back">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-face left">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-face right">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-face top">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-face bottom">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 标题 -->
  <h1 class="title">MagicianPCL</h1>
  <p class="subtitle">轻量 · 高效 · 开源</p>

  <!-- 进度条 -->
  <div class="progress-container">
    <div class="status-text" id="statusText">
      <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      <span id="statusMessage">正在初始化...</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-percent" id="progressPercent">0%</div>
  </div>

  <!-- 检测项列表 -->
  <div class="check-list" id="checkList">
    <div class="check-item pending" id="check-init">
      <div class="check-icon">○</div>
      <span>初始化系统</span>
    </div>
    <div class="check-item pending" id="check-java">
      <div class="check-icon">○</div>
      <span>检测 Java 环境</span>
    </div>
    <div class="check-item pending" id="check-minecraft">
      <div class="check-icon">○</div>
      <span>检查 Minecraft 目录</span>
    </div>
    <div class="check-item pending" id="check-config">
      <div class="check-icon">○</div>
      <span>加载配置文件</span>
    </div>
    <div class="check-item pending" id="check-versions">
      <div class="check-icon">○</div>
      <span>扫描已安装版本</span>
    </div>
  </div>

  <!-- 版本信息 -->
  <div class="version-info">
    MagicianPCL <span>v1.1.0</span> · Electron <span id="electronVersion">-</span>
  </div>

  <div class="developer">by <span>Duck</span></div>

  <script>
    // 生成背景粒子
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (6 + Math.random() * 4) + 's';
      particlesContainer.appendChild(particle);
    }

    // 接收主进程消息
    if (typeof electronAPI !== 'undefined') {
      electronAPI.onSplashProgress((data) => {
        const { step, message, progress, done } = data;
        
        // 更新状态文字
        document.getElementById('statusMessage').textContent = message;
        
        // 更新进度条
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = progress + '%';
        
        // 更新检测项状态
        const checkId = 'check-' + step;
        const checkElement = document.getElementById(checkId);
        if (checkElement) {
          checkElement.className = 'check-item done';
          checkElement.querySelector('.check-icon').innerHTML = '✓';
        }
        
        // 完成后淡出
        if (done) {
          document.getElementById('statusMessage').textContent = '准备就绪！';
          document.querySelector('.status-icon').classList.add('done');
          document.querySelector('.status-icon').innerHTML = '✓';
        }
      });
    }
  </script>
</body>
</html>
